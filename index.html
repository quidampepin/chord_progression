<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="page">

  <header class="masthead">
    <div class="brand">
      <h1 class="wordmark">Cadence</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="toggles">
      <div class="seg" role="group" aria-label="Language / Langue">
        <button type="button" id="lang-en" data-lang="en">EN</button>
        <button type="button" id="lang-fr" data-lang="fr">FR</button>
      </div>
      <div class="seg" role="group" aria-label="Note names">
        <button type="button" id="nota-letters" data-notation="letters">C D E</button>
        <button type="button" id="nota-solfege" data-notation="solfege">Do Ré Mi</button>
      </div>
    </div>
  </header>

  <section class="console" aria-label="Settings">
    <div class="fields">
      <label class="field"><span data-i18n="key"></span><select id="key"></select></label>
      <label class="field"><span data-i18n="mode"></span><select id="mode"></select></label>
      <label class="field"><span data-i18n="style"></span><select id="style"></select></label>
      <label class="field"><span data-i18n="length"></span><select id="length"></select></label>
      <div class="field field-seg">
        <span data-i18n="color"></span>
        <div class="seg seg-wide" role="group" id="color">
          <button type="button" data-color="0" data-i18n="color0"></button>
          <button type="button" data-color="1" data-i18n="color1"></button>
          <button type="button" data-color="2" data-i18n="color2"></button>
        </div>
      </div>
      <div class="field field-seg">
        <span data-i18n="rhythm"></span>
        <div class="seg seg-wide" role="group" id="rhythm">
          <button type="button" data-rhythm="varied" data-i18n="rhythmVaried"></button>
          <button type="button" data-rhythm="steady" data-i18n="rhythmSteady"></button>
        </div>
      </div>
      <div class="field field-seg">
        <span data-i18n="ending"></span>
        <div class="seg seg-wide" role="group" id="ending">
          <button type="button" data-ending="loop" data-i18n="endLoop"></button>
          <button type="button" data-ending="resolve" data-i18n="endResolve"></button>
        </div>
      </div>
      <label class="field field-range">
        <span data-i18n="adventure"></span>
        <input type="range" id="adventure" min="0" max="1" step="0.05">
      </label>
      <label class="check"><input type="checkbox" id="smooth-bass"><span data-i18n="smoothBass"></span></label>
    </div>
    <button type="button" class="btn-generate" id="generate"><span data-i18n="generate"></span><kbd>G</kbd></button>
  </section>

  <section class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <div>
        <h2 id="sheet-title" class="sheet-title"></h2>
        <p id="source" class="source"></p>
      </div>
      <div class="view-switch">
        <span class="mini-label" data-i18n="instrument"></span>
        <div class="seg" role="group" id="view">
          <button type="button" data-inst="guitar" data-i18n="sounds.guitar"></button>
          <button type="button" data-inst="ukulele" data-i18n="sounds.ukulele"></button>
          <button type="button" data-inst="piano" data-i18n="sounds.piano"></button>
          <button type="button" data-inst="pad" data-i18n="sounds.pad"></button>
        </div>
        <label class="field field-inline" id="tuning-wrap"><span class="sr" data-i18n="tuning"></span><select id="tuning"></select></label>
        <label class="field field-inline" id="piano-style-wrap"><span class="sr" data-i18n="voicing"></span><select id="piano-style"></select></label>
      </div>
    </div>
    <div id="measures" class="measures"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="transport" aria-label="Playback">
    <button type="button" id="play" class="btn-play" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-play"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-stop"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      <span id="play-label"></span>
    </button>
    <label class="field field-inline tempo"><span data-i18n="tempo"></span><input type="range" id="tempo" min="50" max="180" step="1"><output id="tempo-out"></output></label>
    <label class="field field-inline"><span data-i18n="pattern"></span><select id="pattern"></select></label>
    <label class="check"><input type="checkbox" id="repeat"><span data-i18n="repeat"></span></label>
    <div class="transport-actions">
      <button type="button" class="btn-ghost" id="copy" data-i18n="copy"></button>
      <button type="button" class="btn-ghost" id="midi" data-i18n="midi"></button>
    </div>
    <p class="hint" data-i18n="shortcuts"></p>
  </section>

  <section class="scales" aria-label="Scales and licks">
    <div class="panel-tabs" role="tablist">
      <button type="button" role="tab" id="tab-scales" data-tab="scales" aria-controls="scales-body" data-i18n="tabScales"></button>
      <button type="button" role="tab" id="tab-licks" data-tab="licks" aria-controls="licks-body" data-i18n="tabLicks"></button>
    </div>
    <div id="scales-body" class="panel-body" role="tabpanel" aria-labelledby="tab-scales">
    <div class="scales-head">
      <div class="scales-title-wrap">
        <h2 class="h2" id="scales-title" data-i18n="scalesTitle"></h2>
        <p class="scale-for" id="scale-for"></p>
      </div>
      <div class="scales-controls">
        <div class="seg" role="group" id="scale-scope">
          <button type="button" data-scope="key" data-i18n="scopeKey"></button>
          <button type="button" data-scope="chord" data-i18n="scopeChord"></button>
        </div>
        <div class="seg" role="group" id="scale-labels">
          <button type="button" data-lab="degrees" data-i18n="labDegrees"></button>
          <button type="button" data-lab="names" data-i18n="labNames"></button>
        </div>
        <button type="button" class="btn-ghost" id="play-scale" data-i18n="playScale"></button>
      </div>
    </div>
    <div class="chips" id="scale-options"></div>
    <p class="scale-why" id="scale-why"></p>
    <div class="chord-scales" id="chord-scales" hidden></div>
    <div class="pos-row" id="pos-row"></div>
    <div class="neck-wrap" id="neck"></div>
    <p class="scale-legend"><span class="sl croot"><i></i><span data-i18n="lgChordRoot"></span></span><span class="sl ctone"><i></i><span data-i18n="lgChordTone"></span></span><span class="sl scale"><i></i><span data-i18n="lgScale"></span></span><span class="sl sroot"><i></i><span data-i18n="lgScaleRoot"></span></span><span class="sl avoid"><i></i><span data-i18n="lgAvoid"></span></span></p>
    </div>
    <div id="licks-body" class="panel-body" role="tabpanel" aria-labelledby="tab-licks" hidden>
      <div class="scales-head">
        <div class="scales-title-wrap">
          <h2 class="h2" data-i18n="licksTitle"></h2>
          <p class="scale-for" id="licks-sub"></p>
        </div>
      </div>
      <div class="licks-grid">
        <div class="lick-list-wrap">
          <div class="chips" id="lick-filters"></div>
          <label class="check"><input type="checkbox" id="lick-fit"><span data-i18n="lickFitOnly"></span></label>
          <ul class="lick-list" id="lick-list"></ul>
        </div>
        <div class="lick-detail" id="lick-detail" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <div class="lower">
    <section class="focus" aria-live="polite">
      <p class="eyebrow" data-i18n="selected"></p>
      <div id="focus"></div>
    </section>
    <aside class="side">
      <section class="why">
        <h2 class="h2" data-i18n="why"></h2>
        <div id="flow" class="flow"></div>
        <ul id="analysis" class="analysis"></ul>
        <p class="fn-help" data-i18n="fnHelp"></p>
      </section>
      <section class="history">
        <h2 class="h2" data-i18n="recent"></h2>
        <ol id="history"></ol>
      </section>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script src="js/theory.js"></script>
<script src="js/generator.js"></script>
<script src="js/voicing.js"></script>
<script src="js/scales.js"></script>
<script src="js/licks.js"></script>
<script src="js/audio.js"></script>
<script src="js/i18n.js"></script>
<script src="js/diagrams.js"></script>
<script src="js/app.js"></script>
</body>
</html>
